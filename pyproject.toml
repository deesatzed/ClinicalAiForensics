[project]
name = "clinai-forensics-pdde"
version = "0.1.0"
description = "Phase 0 CLI scaffold for Clinical Decision Episode simulation under uncertainty."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "scipy>=1.13,<2.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.34,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
pdde = "pdde.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

